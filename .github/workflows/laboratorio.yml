name: Laboratório de estratégias (GitHub)

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia 03:00 UTC (meia-noite de Brasília)
  workflow_dispatch: {}

concurrency:
  group: laboratorio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Testa as estratégias famosas do GitHub nos dados de 2025 em diante
        run: python laboratorio/github_estrategias.py
      - name: Salvar ranking
        run: |
          git config user.name "mesa-de-agentes"
          git config user.email "mesa@users.noreply.github.com"
          git add data/estrategias.json
          git diff --cached --quiet && exit 0
          git commit -q -m "laboratório: ranking das estratégias $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs && git push -q && break; sleep 7; done
