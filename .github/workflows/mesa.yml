name: Mesa de Agentes 24h

on:
  schedule:
    - cron: "*/15 * * * *"  # a cada 15 min (repositório público = minutos ilimitados); o cron-job.org dispara também
  workflow_dispatch: {}

concurrency:
  group: mesa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Chaves da Alpaca (papel)
        env:
          K: ${{ secrets.ALPACA_KEY }}
          S: ${{ secrets.ALPACA_SECRET }}
        run: |
          mkdir -p data
          printf 'ALPACA_KEY=%s\nALPACA_SECRET=%s\n' "$K" "$S" > data/alpaca.env

      - name: ARANHA — coleta, traduz e explica
        run: |
          python -c "import aranha; c=aranha.db(); print('notícias', aranha.noticias(c)); aranha.mercado(c); c.commit()"
          cd mesa && python explicador.py
          cd .. && python equipe/impacto.py || true

      - name: FOGUETE v2 (Binance demo, toda rodada)
        if: always()
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: python foguete2.py || true

      - name: IA PURA (operações escolhidas pelo Claude)
        if: always()
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: python ia_pura.py || true

      - name: MÁQUINA DO TEMPO (probabilidade de alvo x stop)
        if: always()
        run: python equipe/maquina_tempo.py || true

      - name: ARANHA ANALISTA (IA da NVIDIA)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M)
          if { [ $((10#$H % 3)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ ! -f data/analise_ia.json ]; then timeout 300 python equipe/aranha_ia.py || true; else echo "IA roda a cada 3h"; fi

      - name: Robô de tendência cripto (a cada 4h)
        if: always()
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M); if { [ $((10#$H % 4)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python robo.py; else echo "fora do horário ($H UTC)"; fi

      - name: Robô de ações + Alpaca (pregão de NY)
        if: always()
        run: |
          H=$(date -u +%H); D=$(date -u +%u)
          M=$(date -u +%M); if { [ "$D" -le 5 ] && [ "$H" -eq 20 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then cd acoes && python robo_acoes.py; else echo "fora do pregão ($D/$H UTC)"; fi

      - name: FOGUETE DE AÇÕES (rotação de ETFs alavancados, Alpaca)
        if: always()
        run: |
          H=$(date -u +%H); D=$(date -u +%u); M=$(date -u +%M)
          if { [ "$D" -le 5 ] && [ "$H" -eq 19 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then cd acoes && python rotacao.py; else echo "fora da janela"; fi

      - name: CALENDÁRIO + SEC + FILLS + SENTINELA
        if: always()
        run: |
          cd equipe
          python calendario.py || true
          H=$(date -u +%H); M=$(date -u +%M); if { [ $((10#$H % 2)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python sec.py || true; fi
          python fills.py || true
          python sentinela.py || true
          python prova.py || true

      - name: CHEFE — placar geral
        if: always()
        run: python central.py

      - name: SITE (Vercel) — telas + dados
        if: always()
        run: python mesa/exportar_site.py || true

      - name: Salvar resultados
        if: always()
        run: |
          rm -f data/alpaca.env
          git config user.name "mesa-de-agentes"
          git config user.email "mesa@users.noreply.github.com"
          for f in data/aranha.db data/carteira.json data/relatorio_aranha.json data/calendario.json data/sec.json data/fills.json data/sentinela.json data/prova.json data/foguete2.json data/ia_pura.json data/probabilidades.json data/foguete2_trades.csv data/foguete2_exec.json data/analise_ia.json acoes/carteira_acoes.json acoes/carteira_rotacao.json acoes/ordens.json diario site; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -q -m "mesa: rodada $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
