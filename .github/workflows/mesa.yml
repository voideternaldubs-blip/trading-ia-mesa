name: Mesa de Agentes 24h

on:
  schedule:
    - cron: "*/15 * * * *"  # a cada 15 min (repositório público = minutos ilimitados); o cron-job.org dispara também
  workflow_dispatch:
    inputs:
      forcar:
        description: "forçar robôs lentos (tendência, ações, SEC) fora da janela"
        type: boolean
        default: false

concurrency:
  group: mesa
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # a rodada dispara a próxima (motor em corrente, sem depender do agendador do GitHub)

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONIOENCODING: utf-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dados          # dados vivem no ramo "dados" (não gasta publicação da Vercel)
          fetch-depth: 0

      - name: Código novo (main) por cima dos dados
        run: |
          git config user.name "mesa-de-agentes"
          git config user.email "mesa@users.noreply.github.com"
          git fetch -q origin main
          git merge -q --no-edit -X ours origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Chaves da Alpaca (papel)
        env:
          K: ${{ secrets.ALPACA_KEY }}
          S: ${{ secrets.ALPACA_SECRET }}
        run: |
          mkdir -p data
          printf 'ALPACA_KEY=%s\nALPACA_SECRET=%s\n' "$K" "$S" > data/alpaca.env

      - name: ARANHA — coleta, traduz e explica
        run: |
          python -c "import aranha; c=aranha.db(); print('notícias', aranha.noticias(c)); aranha.mercado(c); c.commit()"
          cd mesa && python explicador.py
          cd .. && python equipe/impacto.py || true

      - name: FOGUETE v2 (Binance demo, toda rodada)
        if: always()
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: python foguete2.py || true

      - name: CARTEIRAS (do Prédio e manual) conferem stop/alvo
        if: always()
        env:
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: |
          python ia_pura.py data/carteira_predio.json || true
          python ia_pura.py || true

      - name: MÁQUINA DO TEMPO (probabilidade de alvo x stop)
        if: always()
        run: python equipe/maquina_tempo.py || true

      - name: ARANHA ANALISTA (IA da NVIDIA)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M)
          if { [ $((10#$H % 3)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ ! -f data/analise_ia.json ]; then timeout 300 python equipe/aranha_ia.py || true; else echo "IA roda a cada 3h"; fi

      - name: Robô de tendência cripto (a cada 4h)
        if: always()
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M); if { [ $((10#$H % 4)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ inputs.forcar }}" = "true" ]; then python robo.py; else echo "fora do horário ($H UTC)"; fi

      - name: Robô de ações + Alpaca (pregão de NY)
        if: always()
        run: |
          H=$(date -u +%H); D=$(date -u +%u)
          M=$(date -u +%M); if { [ "$D" -le 5 ] && [ "$H" -eq 20 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ inputs.forcar }}" = "true" ]; then cd acoes && python robo_acoes.py; else echo "fora do pregão ($D/$H UTC)"; fi

      - name: FOGUETE DE AÇÕES (rotação de ETFs alavancados, Alpaca)
        if: always()
        run: |
          H=$(date -u +%H); D=$(date -u +%u); M=$(date -u +%M)
          if { [ "$D" -le 5 ] && [ "$H" -eq 19 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ inputs.forcar }}" = "true" ]; then cd acoes && python rotacao.py; else echo "fora da janela"; fi

      - name: CALENDÁRIO + SEC + FILLS + SENTINELA
        if: always()
        run: |
          cd equipe
          python calendario.py || true
          H=$(date -u +%H); M=$(date -u +%M); if { [ $((10#$H % 2)) -eq 0 ] && [ $((10#$M)) -lt 15 ]; } || [ "${{ inputs.forcar }}" = "true" ]; then python sec.py || true; fi
          python fills.py || true
          python sentinela.py || true
          python prova.py || true

      - name: CHEFE — placar geral
        if: always()
        run: python central.py

      - name: SITE (Vercel) — telas + dados
        if: always()
        run: python mesa/exportar_site.py || true

      - name: Salvar resultados
        if: always()
        run: |
          rm -f data/alpaca.env
          git config user.name "mesa-de-agentes"
          git config user.email "mesa@users.noreply.github.com"
          for f in data/aranha.db data/carteira.json data/relatorio_aranha.json data/calendario.json data/sec.json data/fills.json data/sentinela.json data/prova.json data/foguete2.json data/ia_pura.json data/carteira_predio.json data/probabilidades.json data/foguete2_trades.csv data/foguete2_exec.json data/analise_ia.json acoes/carteira_acoes.json acoes/carteira_rotacao.json acoes/ordens.json diario site; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -q -m "mesa: rodada $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs origin dados && git push -q origin HEAD:dados && break; sleep 5; done

      - name: Publica o site na Vercel quando a página mudou (no máximo a cada 3 h)
        if: always()
        run: |
          git fetch -q origin main
          A=$(curl -s https://mesa-de-agentes-pi.vercel.app/ | md5sum | cut -c1-32)
          B=$(git show origin/main:site/index.html | md5sum | cut -c1-32)
          U=$(cat data/ultimo_publica 2>/dev/null || echo 0); AGORA=$(date +%s)
          if [ "$A" != "$B" ] && [ $((AGORA-U)) -gt 10800 ]; then
            git worktree add -q /tmp/pub origin/main && (cd /tmp/pub && git commit -q --allow-empty -m "publica site" && git push -q origin HEAD:main) && echo $AGORA > data/ultimo_publica && git add data/ultimo_publica && git commit -qm "marca publicação" && git push -q origin HEAD:dados || true
          else echo "site em dia ou publicado há menos de 3 h"; fi

      - name: MOTOR RÁPIDO (40 min sem parar, ciclo de 2 min)
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BINANCE_KEY: ${{ secrets.BINANCE_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        run: python motor.py --minutos 40 || true

      - name: PRÓXIMA RODADA (a corrente não para)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mesa.yml --ref main || gh workflow run mesa.yml --ref main
